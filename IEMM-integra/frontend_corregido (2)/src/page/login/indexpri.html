<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>

    <link rel="stylesheet" href="styleprin.css">
</head>

<body>
    <main class="login-container">

        <section class="login-box">

            <div class="logo-container">
                <img src="../../img/ESCUDO.png"
                     alt="Logo Institución Educativa María Montessori"
                     class="logo">
            </div>

            <div class="institution">
                <span class="institution educativa Maria Montessori">COLEGIO</span>
                <h1>MARÍA MONTESSORI</h1>
            </div>

            <div class="decoracion">
                <span></span>
                <div class="mini-escudo">♢</div>
                <span></span>
            </div>

            <h2>Iniciar Sesión</h2>

            <div id="login-error" class="login-error"></div>

            <form class="login-form" id="form-login">

                <div class="input-group">
                    <label for="correo">Correo electrónico</label>

                    <div class="input-wrapper">
                        <span class="icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            name="correo"
                            placeholder="Ingresa tu correo electrónico"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="password">Contraseña</label>

                    <div class="input-wrapper">
                        <span class="icon">♙</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            required
                        >

                        <span class="eye">◉</span>
                    </div>
                </div>

                <button type="submit" class="btn-continuar" id="btn-login">
                    <span>Continuar</span>
                    <span class="arrow">→</span>
                </button>

            </form>

        </section>

    </main>

    <script type="module" src="login.js"></script>
</body>
</html>
